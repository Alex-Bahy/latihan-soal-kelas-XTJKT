<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f1a;
    --surface: #141928;
    --card: #1a2035;
    --border: #2a3450;
    --accent: #00e5ff;
    --accent2: #7c3aed;
    --accent3: #10b981;
    --wrong: #ef4444;
    --text: #e2e8f0;
    --muted: #7a8aa0;

  }

  body {

    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

    inset: 0;
    background:

    text-align: center;

  .header .badge {
    display: inline-block;
    background: rgba(0,229,255,0.1);
    border: 1px solid rgba(0,229,255,0.3);
    color: var(--accent);
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    padding: 0.3rem 0.9rem;

    margin-bottom: 1rem;
    text-transform: uppercase;
  }

    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -0.02em;
  }
  .header h1 span { color: var(--accent); }
  .header p {
    color: var(--muted);
    font-size: 0.9rem;
    margin-top: 0.5rem;
    font-family: 'Space Mono', monospace;
  }

    position: sticky;

    z-index: 100;
    background: rgba(11,15,26,0.92);

    padding: 0.7rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .progress-track {
    flex: 1;
    height: 6px;
    background: var(--border);
    border-radius: 100px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 100px;
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
  }
  .progress-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    white-space: nowrap;
  }
  .score-badge {
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    background: rgba(0,229,255,0.1);
    border: 1px solid rgba(0,229,255,0.25);
    color: var(--accent);
    padding: 0.25rem 0.7rem;
    border-radius: 100px;
    white-space: nowrap;
  }

    max-width: 800px;
    margin: 0 auto;
    padding: 1.5rem 1rem 5rem;
    position: relative;
    z-index: 5;

    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent2);
    border-radius: 12px;
    padding: 1.2rem 1.4rem;
    margin-bottom: 1.5rem;
    font-size: 0.88rem;
    line-height: 1.75;
    color: #c2cce0;
  }
  .passage .passage-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    color: var(--accent2);
    text-transform: uppercase;
    margin-bottom: 0.6rem;
    display: block;

    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    color: var(--accent);
    text-transform: uppercase;
    margin: 2rem 0 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border);
  }

  .q-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    margin-bottom: 1.2rem;
    overflow: hidden;
    transition: box-shadow 0.3s;

  .q-header {
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    padding: 1.2rem 1.4rem 1rem;
  }
  .q-num {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    background: rgba(0,229,255,0.1);
    border: 1px solid rgba(0,229,255,0.2);
    color: var(--accent);
    padding: 0.2rem 0.55rem;
    border-radius: 6px;
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: 0.1rem;
  }
  .q-text {
    font-size: 0.92rem;
    line-height: 1.65;
    font-weight: 400;
  }
  .q-text em {
    font-style: italic;
    color: #a0b4cc;
    background: rgba(124,58,237,0.1);
    padding: 0 0.25rem;
    border-radius: 3px;
  }

  .q-options {
    padding: 0 1.4rem 1.2rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .option-btn {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    width: 100%;
    background: rgba(42,52,80,0.4);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.65rem 1rem;
    cursor: pointer;
    text-align: left;
    color: var(--text);
    font-size: 0.87rem;
    font-family: 'Sora', sans-serif;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .option-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, var(--accent), transparent);
    opacity: 0;
    transition: opacity 0.25s;
  }
  .option-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: rgba(0,229,255,0.07);
  }
  .option-btn:hover:not(:disabled)::before { opacity: 0.04; }
  .option-btn:disabled { cursor: default; }

  .opt-key {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    font-weight: 700;
    min-width: 22px;
    height: 22px;
    border-radius: 5px;
    background: var(--border);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
  }

  .option-btn.correct {
    background: rgba(16,185,129,0.12);
    border-color: var(--accent3);
  }
  .option-btn.correct .opt-key {
    background: var(--accent3);
    color: #fff;
  }
  .option-btn.wrong {
    background: rgba(239,68,68,0.1);
    border-color: var(--wrong);
  }
  .option-btn.wrong .opt-key {
    background: var(--wrong);
    color: #fff;
  }
  .option-btn.revealed-correct {
    background: rgba(16,185,129,0.07);
    border-color: rgba(16,185,129,0.4);
  }

  .feedback {
    margin: 0 1.4rem 1.2rem;
    border-radius: 10px;
    padding: 0.9rem 1.1rem;
    font-size: 0.84rem;
    line-height: 1.6;
    display: none;
    animation: feedIn 0.3s ease;
  }

    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .feedback.show { display: block; }
  .feedback.correct-fb {
    background: rgba(16,185,129,0.1);
    border: 1px solid rgba(16,185,129,0.25);
  }
  .feedback.wrong-fb {
    background: rgba(239,68,68,0.08);
    border: 1px solid rgba(239,68,68,0.2);
  }
  .feedback .fb-title {
    font-weight: 700;
    font-size: 0.8rem;
    margin-bottom: 0.35rem;
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.05em;
  }

  .feedback.wrong-fb .fb-title { color: var(--wrong); }
  .feedback .fb-id { color: var(--gold); font-weight: 600; }
  .feedback .fb-exp { color: #c2cce0; }

    text-align: center;

    content: '';

    inset: -4px;

    border: 4px solid transparent;

    border-right-color: var(--accent2);

    font-size: 2.8rem;
    font-weight: 800;
    line-height: 1;
    color: var(--accent);

  .result-score-denom {
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 0.2rem;
  }
  .result-title {
    font-size: 1.6rem;
    font-weight: 800;
    margin-bottom: 0.5rem;
  }
  .result-sub {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 2rem;
  }
  .result-stats {
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
  }
  .stat-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.9rem 1.4rem;
    min-width: 90px;
  }
  .stat-box .s-num { font-size: 1.5rem; font-weight: 700; }
  .stat-box .s-label { font-family: 'Space Mono', monospace; font-size: 0.65rem; color: var(--muted); margin-top: 0.2rem; letter-spacing: 0.08em; text-transform: uppercase; }

  .stat-box.red .s-num { color: var(--wrong); }
  .stat-box.blue .s-num { color: var(--accent); }

  .btn-restart {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #000;
    font-family: 'Space Mono', monospace;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 0.8rem 2rem;
    border-radius: 100px;
    border: none;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    letter-spacing: 0.05em;
  }
  .btn-restart:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,229,255,0.3);
  }

  /* NAV */
  .quiz-nav {
    display: flex;
    justify-content: flex-end;
    padding: 0 1.4rem 1.2rem;
  }
  .btn-submit-all {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: #fff;
    font-family: 'Space Mono', monospace;
    font-size: 0.78rem;
    font-weight: 700;
    padding: 0.65rem 1.6rem;
    border-radius: 100px;
    border: none;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    letter-spacing: 0.05em;
    margin-top: 1.5rem;
    width: 100%;
    justify-content: center;
  }
  .btn-submit-all:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(124,58,237,0.35);
  }

  /* Floating counter */
  .float-counter {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    background: rgba(11,15,26,0.92);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 0.6rem 1rem;
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);

    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.15rem;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .float-counter .fc-num {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }

  @media(max-width: 600px) {
    .q-header { padding: 1rem; }
    .q-options { padding: 0 1rem 1rem; }
    .feedback { margin: 0 1rem 1rem; }
    .float-counter { bottom: 1rem; right: 1rem; }
  }
</style>
</head>

// =============================================
//  STATE
// =============================================
let answers = new Array(25).fill(null); // null = unanswered
let score = 0;
let answered = 0;

// =============================================
//  BUILD UI
// =============================================
function buildQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';

  let lastPassage = null;
  QUESTIONS.forEach((q, idx) => {
    // Passage block
    if (q.passage && q.passage !== lastPassage) {
      const pb = document.createElement('div');
      pb.className = 'passage';
      pb.innerHTML = PASSAGES[q.passage];
      container.appendChild(pb);
      lastPassage = q.passage;
    } else if (!q.passage) {
      lastPassage = null;
    }

    // Card
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = `q-card-${idx}`;

    // Header
    const header = document.createElement('div');
    header.className = 'q-header';
    header.innerHTML = `<span class="q-num">Q${q.id}</span><div class="q-text">${q.text.replace(/\n/g,'<br>')}</div>`;
    card.appendChild(header);

    // Options
    const opts = document.createElement('div');
    opts.className = 'q-options';
    q.opts.forEach((opt, oi) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.dataset.qi = idx;
      btn.dataset.oi = oi;
      const keys = ['A','B','C','D','E'];
      btn.innerHTML = `<span class="opt-key">${keys[oi]}</span><span>${opt.substring(3)}</span>`;
      btn.addEventListener('click', () => handleAnswer(idx, oi, btn));
      opts.appendChild(btn);
    });
    card.appendChild(opts);

    // Feedback
    const fb = document.createElement('div');
    fb.className = 'feedback';
    fb.id = `fb-${idx}`;
    card.appendChild(fb);

    container.appendChild(card);
  });

  // Submit button
  const submitBtn = document.createElement('button');
  submitBtn.className = 'btn-submit-all';
  submitBtn.textContent = '🎯  Lihat Hasil Akhir';
  submitBtn.id = 'submit-btn';
  submitBtn.addEventListener('click', showResult);
  container.appendChild(submitBtn);

  updateProgress();
}

// =============================================
//  HANDLE ANSWER
// =============================================
function handleAnswer(qi, oi, btn) {
  if (answers[qi] !== null) return; // already answered

  const q = QUESTIONS[qi];
  const card = document.getElementById(`q-card-${qi}`);
  const allBtns = card.querySelectorAll('.option-btn');
  const fb = document.getElementById(`fb-${qi}`);

  allBtns.forEach(b => b.disabled = true);

  const isCorrect = (oi === q.ans);
  answers[qi] = oi;
  answered++;

  if (isCorrect) {
    btn.classList.add('correct');
    score++;
    fb.className = 'feedback correct-fb show';
    fb.innerHTML = `<div class="fb-title">✅ BENAR!</div><div>${q.fb}</div>`;
  } else {
    btn.classList.add('wrong');
    allBtns[q.ans].classList.add('revealed-correct');
    fb.className = 'feedback wrong-fb show';
    fb.innerHTML = `<div class="fb-title">❌ SALAH</div><div>${q.fb}</div>`;
  }

  updateProgress();
  scrollToNext(qi);
}

function scrollToNext(qi) {
  if (qi < QUESTIONS.length - 1) {
    setTimeout(() => {
      const next = document.getElementById(`q-card-${qi+1}`);
      if (next) next.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 500);
  }
}

// =============================================
//  PROGRESS
// =============================================
function updateProgress() {
  const pct = Math.round((answered / 25) * 100);
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-label').textContent = `${answered} / 25`;
  document.getElementById('score-badge').textContent = `Score: ${score}`;
  document.getElementById('fc-answered').textContent = answered;
}

// =============================================
//  RESULT
// =============================================
function showResult() {
  document.getElementById('quiz-container').style.display = 'none';
  document.getElementById('float-counter').style.display = 'none';
  const rs = document.getElementById('result-screen');
  rs.style.display = 'block';

  const pct = Math.round((score / 25) * 100);
  document.getElementById('res-score').textContent = score;
  document.getElementById('res-correct').textContent = score;
  document.getElementById('res-wrong').textContent = 25 - score;
  document.getElementById('res-pct').textContent = pct + '%';

  let title, sub;
  if (pct >= 88) { title = '🏆 Luar Biasa!'; sub = 'Nilai sempurna! Kamu siap untuk dunia IT.'; }
  else if (pct >= 72) { title = '🎉 Bagus Sekali!'; sub = 'Pemahaman yang kuat. Terus tingkatkan!'; }
  else if (pct >= 56) { title = '💪 Cukup Baik!'; sub = 'Kamu di jalur yang benar. Ulangi materi yang salah.'; }
  else { title = '📚 Perlu Belajar Lagi'; sub = 'Jangan menyerah! Baca teks kembali dan coba lagi.'; }

  document.getElementById('res-title').textContent = title;
  document.getElementById('res-sub').textContent = sub;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// =============================================
//  RESTART
// =============================================
function restartQuiz() {
  answers = new Array(25).fill(null);
  score = 0;
  answered = 0;
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('float-counter').style.display = 'flex';
  document.getElementById('quiz-container').style.display = 'block';
  buildQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// =============================================
//  INIT
// =============================================
buildQuiz();
</script>
